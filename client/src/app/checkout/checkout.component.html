<div class="container mt-5">
    <div class="row">
        <div class="col-8">
            <app-stepper [linearModeSelected]="false" #appStepper>
                <cdk-step [label]="'Address'" [completed]="(checkoutParentForm.get('addressForm').valid)">
                    <app-checkout-address [checkoutAddressForm]="checkoutParentForm"></app-checkout-address>
                    Step 1
                </cdk-step>
                <cdk-step [label]="'Delivery'" [completed]="(checkoutParentForm.get('deliveryForm').valid)">
                    <app-checkout-delivery [checkoutDeliveryForm]="checkoutParentForm"></app-checkout-delivery>
                    Step 2
                </cdk-step>
                <cdk-step [label]="'Review'">
                    <app-checkout-review></app-checkout-review>
                    Step 3
                </cdk-step>
                <cdk-step [label]="'Payment'">
                    <app-checkout-payment [checkoutPaymentForm]="checkoutParentForm"></app-checkout-payment>
                    Step 4
                </cdk-step>
            </app-stepper>
        </div>
        <div class="col-4">
            <app-order-totals></app-order-totals>
        </div>
    </div>
</div>
